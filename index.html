<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BOM Extractor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              'primary': '#06a8f9',
              'background-light': '#f5f7f8',
              'background-dark': '#0f1c23',
              'brand-blue': '#06a8f9',
              'brand-blue-light': '#e6f7ff',
              'brand-gray': {
                100: '#F5F5F7',
                200: '#EAEAEB',
                300: '#D1D1D6',
                400: '#AEAEB2',
                500: '#8E8E93',
                600: '#636366',
                700: '#48484A',
                800: '#2C2C2E',
                900: '#1C1C1E',
              }
            },
            fontFamily: {
              'display': ['Inter', 'sans-serif'],
            },
            borderRadius: {
              'DEFAULT': '0.5rem',
              'lg': '1rem',
              'xl': '1.5rem',
              'full': '9999px'
            },
            keyframes: {
              'fade-in': {
                '0%': { opacity: '0' },
                '100%': { opacity: '1' },
              },
            },
            animation: {
              'fade-in': 'fade-in 0.3s ease-out forwards',
            },
          }
        }
      }
    </script>
  <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/pdf-lib/dist/pdf-lib.min.js"></script>
  <script type="importmap">
{
  "imports": {
    "react/": "https://aistudiocdn.com/react@^19.1.1/",
    "react": "https://aistudiocdn.com/react@^19.1.1",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.1.1/",
    "@google/genai": "https://aistudiocdn.com/@google/genai/dist/index.js",
    "pdfjs-dist/": "https://aistudiocdn.com/pdfjs-dist@4.8.69/"
  }
}
</script>
</head>
  <body class="font-display bg-background-light dark:bg-background-dark text-black dark:text-white antialiased">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
